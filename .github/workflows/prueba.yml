name: Prueba (una consulta + notificación de test)

on:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'iphone-duo-mati-68d4f5b1' }}
        run: python3 alerta_iphone.py --test
